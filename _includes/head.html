<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  {%- seo -%}
  {%- feed_meta -%}

  <link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png?v=3" sizes="96x96" />
  <link rel="shortcut icon" href="/assets/images/favicon.ico?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Kyrylo Silin" />
  <link rel="manifest" href="/assets/images/site.webmanifest?v=3" />

  <script async src="https://analytics.kyrylo.org/js/pa-AIFJJD2jjgvAtiz_pzq6_.js"></script>
  <script>
    window.plausible = window.plausible || function () { (plausible.q = plausible.q || []).push(arguments) }, plausible.init = plausible.init || function (i) { plausible.o = i || {} };
    plausible.init()
  </script>

  <style>
    :root {
      --font-size: clamp(1.125rem, 1rem + .3vw, 1.25rem);
      --background: #fff;
      --text: #222;
      --muted: #6b6b6b;
      --link: #2563eb;
      --border: #e5e5e5;
      --surface: #f6f6f6;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: clamp(2rem, 5vw, 4rem) 1.25rem 2rem;
      font: 400 var(--font-size)/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-wrap: break-word;
    }

    main,
    .site-footer {
      max-width: 46rem;
      margin: 0 auto;
    }

    h1,
    h2,
    h3 {
      line-height: 1.2;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    h2,
    h3 {
      margin: 1.75em 0 .65em;
    }

    p,
    ul,
    ol,
    dl {
      margin: 0 0 1.25em;
    }

    li + li {
      margin-top: .35em;
    }

    dd {
      margin-bottom: 1em;
    }

    code {
      font-size: .875em;
      overflow-wrap: anywhere;
    }

    pre {
      padding: 1rem 1.25rem;
      overflow: auto;
      background: var(--surface);
      font: .875rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    pre code {
      font: inherit;
      overflow-wrap: normal;
    }

    blockquote {
      margin: 1.5em 0;
      padding-left: 1.25rem;
      border-left: 3px solid var(--border);
      color: var(--muted);
    }

    hr {
      margin: 2em 0;
      border: 0;
      border-top: 1px solid var(--border);
    }

    .article img,
    .article video {
      max-width: 100%;
      height: auto;
    }

    .article iframe {
      max-width: 100%;
    }

    .article figure {
      margin: 1.5em 0;
    }

    .article figcaption {
      color: var(--muted);
      font-size: .8em;
    }

    .article table {
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      margin-bottom: 1.25em;
    }

    .article th,
    .article td {
      padding: .5em .75em;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    a,
    a:visited {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--link);
      text-decoration-thickness: 1px;
      text-underline-offset: .15em;
    }

    a:hover,
    a:focus-visible,
    a:active {
      color: var(--link);
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    .site-title {
      margin-top: 0;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 1em;
      margin-bottom: 1.5rem;
    }

    .site-header > a {
      flex-shrink: 0;
      text-decoration: none;
    }

    .site-navigation {
      display: flex;
      flex-wrap: wrap;
      gap: .5em 1.25em;
      margin: 1.5rem 0 2.5rem;
      font-size: .9em;
    }

    .site-navigation a[aria-current="page"] {
      color: var(--link);
      font-weight: 600;
      text-decoration-thickness: 2px;
    }

    .listing {
      max-width: 38rem;
      margin: 0 auto;
    }

    .listing-title {
      margin: 0 0 2.5rem;
      font-size: clamp(1.75rem, 1.25rem + 2vw, 2.25rem);
      text-align: center;
    }

    .blog-year + .blog-year,
    .project-section + .project-section {
      margin-top: 2.5rem;
    }

    .blog-year h2,
    .project-section h2 {
      margin: 0 0 .75rem;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: normal;
    }

    .project-list {
      margin: 0;
    }

    .project-list dt {
      font-weight: 500;
      line-height: 1.45;
    }

    .project-list dd {
      margin: .4rem 0 1.75rem;
      color: var(--muted);
      font-size: .85em;
    }

    .project-list dd:last-child {
      margin-bottom: 0;
    }

    ul.blog-posts {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul.blog-posts li {
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
      padding: .6em 0;
      margin: 0;
      line-height: 1.45;
    }

    ul.blog-posts time {
      flex: 0 0 4rem;
      font-size: .75em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .profile-photo {
      display: block;
      width: 4rem;
      height: 4rem;
    }

    .home {
      max-width: 36rem;
      margin: 0 auto;
      text-align: center;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .profile-header .site-title {
      width: min(100%, 14.5rem);
      margin: 0;
    }

    .profile-header .site-logo {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 332 / 41;
      object-fit: contain;
      margin-inline: auto;
    }

    .profile-home-link {
      display: block;
      text-decoration: none;
    }

    .profile-photo-large {
      width: 6rem;
      height: 6rem;
      border-radius: 50%;
    }

    .home .site-navigation,
    .listing .site-navigation {
      justify-content: center;
      margin: 1.75rem 0 3rem;
    }

    .home-intro h2 {
      margin: 0 0 1.25rem;
      font-size: clamp(1.75rem, 1.25rem + 2vw, 2.25rem);
    }

    .home-project {
      text-wrap: balance;
    }

    .home-location {
      position: relative;
      width: min(100%, 28rem);
      margin: 1.75rem auto 0;
    }

    .home-location svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .location-grid {
      fill: none;
      stroke: var(--border);
      stroke-width: .5;
    }

    .location-land {
      color: var(--muted);
      fill: url(#location-dots);
      opacity: .35;
    }

    .location-country {
      color: var(--link);
      fill: url(#location-country-dots);
      stroke: var(--link);
      stroke-width: .6;
      stroke-linejoin: round;
      opacity: .65;
    }

    .location-route {
      fill: none;
      stroke: var(--link);
      stroke-width: 1.5;
      stroke-dasharray: 3 5;
      stroke-linecap: round;
    }

    .location-origin {
      fill: var(--background);
      stroke: var(--link);
      stroke-width: 1.5;
    }

    .location-destination,
    .location-halo {
      fill: var(--link);
    }

    .location-halo {
      opacity: .15;
    }

    .location-label {
      position: absolute;
      display: flex;
      flex-direction: column;
      line-height: 1.4;
    }

    .location-label-origin {
      top: 24.2%;
      right: 80%;
      transform: translateY(-50%);
      text-align: right;
    }

    .location-label-destination {
      top: 82%;
      left: 82.2%;
      transform: translateX(-50%);
      text-align: center;
    }

    .location-caption {
      color: var(--muted);
      font-size: .625rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .location-city {
      color: var(--text);
      font-size: .875rem;
      font-weight: 500;
    }

    .location-country-name {
      color: var(--muted);
      font-size: .6875rem;
    }

    @media (prefers-reduced-motion: no-preference) {
      .location-halo {
        transform-box: fill-box;
        transform-origin: center;
        animation: location-arrival 3s ease-out 2;
      }

      @keyframes location-arrival {
        0%, 100% { transform: scale(1); opacity: .15; }
        65% { transform: scale(1.6); opacity: 0; }
        66% { transform: scale(1); opacity: 0; }
      }
    }

    .home-contact {
      margin-top: 2.25rem;
      color: var(--muted);
      font-size: .85em;
    }

    .home-contact p {
      margin-bottom: .6rem;
    }

    .home-signature {
      margin-top: 2rem;
      color: var(--muted);
      font-size: clamp(.6875rem, 2.8vw, .8125rem);
      line-height: 1.7;
    }

    .home-signature code {
      display: inline-block;
      font-size: 1em;
      text-align: left;
      white-space: nowrap;
    }

    .post-header {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .post-author {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: .65rem;
      margin-bottom: 2.75rem;
      text-decoration: none;
    }

    .post-author-logo {
      display: block;
      width: 8.25rem;
      height: auto;
    }

    .author-avatar {
      display: block;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-date {
      margin-bottom: .65rem;
      color: var(--muted);
      font-size: .75em;
    }

    .post-header h1 {
      margin: 0;
      font-size: clamp(2rem, 1.4rem + 2vw, 2.75rem);
      line-height: 1.12;
    }

    .post-about {
      margin-top: 3.5rem;
      text-align: center;
      font-size: .8em;
      color: var(--muted);
    }

    .post-about p {
      margin-bottom: .75em;
    }

    .post-about-author {
      display: inline-block;
      margin-bottom: .5rem;
      text-decoration: none;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: .25rem;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      text-decoration: none;
    }

    .social-links svg {
      display: block;
      width: 1.25rem;
      height: 1.25rem;
    }

    .post-navigation {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem 2rem;
      max-width: 38rem;
      margin: 2.5rem auto 0;
      color: var(--muted);
      font-size: .8em;
      line-height: 1.45;
    }

    .post-navigation-link {
      text-decoration: none;
    }

    .post-navigation-label {
      display: block;
      margin-bottom: .35em;
      font-size: .85em;
    }

    .post-navigation-title {
      text-decoration: underline;
      text-decoration-color: var(--link);
      text-decoration-thickness: 1px;
    }

    .post-navigation-next {
      grid-column: 2;
      text-align: right;
    }

    .post-navigation-link:only-child {
      grid-column: 1 / -1;
      text-align: center;
    }

    .site-footer {
      clear: both;
      margin-top: 3rem;
      padding-top: 1.25rem;
      color: var(--muted);
      font-size: .75em;
      text-align: center;
    }

    .site-footer p {
      margin-bottom: .5em;
    }

    .site-footer-home {
      margin-top: 2rem;
    }

    @media (max-width: 37.5rem) {
      .post-navigation {
        grid-template-columns: minmax(0, 1fr);
      }

      .post-navigation-link {
        grid-column: auto;
        text-align: center;
      }

      ul.blog-posts li {
        flex-direction: column;
        gap: .15rem;
        padding: .65em 0;
      }

      ul.blog-posts time {
        flex-basis: auto;
      }

    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #181818;
        --text: #e5e5e5;
        --muted: #aaa;
        --link: #8abfff;
        --border: #383838;
        --surface: #242424;
      }

    }
  </style>
{% if page.stylesheet %}
  <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
{% endif %}
</head>
