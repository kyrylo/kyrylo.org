<footer class="site-footer{% if page.layout == 'home' %} site-footer-home{% endif %}">
  <p>Subscribe to new posts via the <a href="{{ '/feed.xml' | relative_url }}">Atom feed</a>.</p>
{% unless page.layout == 'home' or page.layout == 'listing' %}
  <p><small>Last modified: <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">{{ page.last_modified_at | date: "%B %d, %Y" }}</time></small></p>
{% endunless %}
</footer>
