<!doctype html><meta charset="utf-8"><title>Real surface wear · Puddle Walker</title>
<style>*{box-sizing:border-box}body{margin:0;background:#192821;color:#f0edcf;font:14px system-ui;padding:28px}h1{font-size:26px;margin:0 0 8px}p{color:#b8c6b3;margin:0 0 24px}#samples{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#24352b;border:1px solid #5c6a4b;padding:16px}h2{font-size:15px;margin:0 0 8px;color:#d9f599}small{display:block;min-height:32px;color:#b8c6b3}canvas{width:100%;height:180px;object-fit:contain;display:block}strong{display:block;text-align:center;color:#d9f599;font-size:12px}.world{position:fixed;left:-3000px;top:0;width:900px;height:800px;visibility:hidden}</style>
<h1>Wear that follows your footsteps.</h1><p>Actual simulated landings · Left shoe exposed / right shoe clean · The same photographic sneakers used in the game</p><div id="samples"></div>
<script type="module">
import {createGame,setShoeMask,indexStreet,MATERIALS,advance,condition,takeStep} from './model.js?v=contact-30';
import {createRenderer} from './render.js?v=contact-30';
for(const [type,depth,age,label,detail,patch] of [
 ['water',6,0,'Just the toe','A shallow puddle touches only the front edge',{y:1165,ry:15}],
 ['mud',9,0,'Fresh gutter mud','Dark, damp clay with torn edges and small clumps',{}],
 ['mud',9,35,'The same mud, dried','The same marks turn paler, duller and rougher',{}],
 ['oil',7,0,'Oily runoff','A thin dark smear retains a low sheen',{}],
 ['gravel',3,0,'Grit along one edge','Fine particles stay where the shoe touched',{x:410,rx:10}],
 ['gum',3,0,'A piece of gum','A small sticky contact on the tread and low rim',{x:410,rx:9,ry:15}]
]){
 const card=document.createElement('article');card.innerHTML=`<h2>${label}</h2><small>${detail}</small><canvas class="world" width="900" height="800"></canvas><canvas class="pair" width="360" height="220"></canvas><strong>Loading…</strong>`;samples.append(card);
 const canvas=card.querySelector('.world'),inspection=card.querySelector('.pair'),renderer=await createRenderer(canvas,inspection),g=createGame('leather',91);if(renderer.mask)setShoeMask(g,renderer.mask);
 g.phase='walking';g.feet.forEach((f,i)=>{f.x=420+i*110;f.y=1000;f.bestY=1000;f.angle=0;});
 g.street=indexStreet({...g.street,patches:[{id:0,type,x:420,y:1135,rx:65,ry:100,depth,seed:4,cos:1,sin:0,dirt:MATERIALS[type].dirt,...patch}],obstacles:[],clutter:[]});
 takeStep(g,{x:420,y:1135});for(let i=0;i<360;i++)advance(g,1/120);
 if(age){g.street=indexStreet({...g.street,patches:[]});for(let i=0;i<age*120;i++)advance(g,1/120);}
 renderer.render(g,performance.now(),1,true);card.querySelector('strong').textContent=`${condition(g,0).toFixed(1)}% clean · ${condition(g,1).toFixed(1)}% clean`;
 if(label==='Fresh gutter mud'){
  const times=[];for(let i=0;i<50;i++){g.feet[0].revision++;const start=performance.now();renderer.render(g,start,1/60,true);if(i>=10)times.push(performance.now()-start);}
  times.sort((a,b)=>a-b);document.body.dataset.renderMedian=times[20].toFixed(2);document.body.dataset.renderP95=times[38].toFixed(2);
 }
}
document.body.dataset.ready='true';
</script>
