<!doctype html><meta charset="utf-8"><base href="/puddle-walker/"><title>Sole cache transitions</title>
<style>body{font:14px system-ui}canvas{width:900px;height:720px}pre{white-space:pre-wrap}</style>
<pre id="report">Checking drying, new stains, cleared soles and new shoes…</pre><canvas id="street"></canvas><canvas id="inspection" width="360" height="220"></canvas>
<script type="module">
import {createGame,setShoeMask,MATERIALS} from './model.js?v=perf-62';
import {createRenderer as before} from './_qa-before-62/render.js?v=perf-61';
import {createRenderer as after} from './render.js?v=perf-62';
const canvas=document.querySelector('#street'),inspection=document.querySelector('#inspection'),ctx=inspection.getContext('2d',{willReadFrequently:true});
const renderers=[await before(canvas,inspection),await after(canvas,inspection)],results=[],names=Object.keys(MATERIALS);
function check(g,label){
 const images=renderers.map((r,i)=>{r.render(g,performance.now()+i,1,true);return ctx.getImageData(0,0,360,220).data;});
 let changed=0,maxDelta=0;for(let i=0;i<images[0].length;i++)if(images[0][i]!==images[1][i]){changed++;maxDelta=Math.max(maxDelta,Math.abs(images[0][i]-images[1][i]));}
 results.push({label,changed,maxDelta});
}
for(const shoe of ['leather','knit','canvas']){
 const g=createGame(shoe,321);setShoeMask(g,renderers[0].mask);g.time=8;
 check(g,shoe+' clean reset');
 for(const type of ['water','mud','oil','gum','gravel','poop']){
  for(const f of g.feet){
   f.stain.fill(.4);f.wetness.fill(.9);f.deposits.fill(MATERIALS[type].liquid?0:.4);f.depositTypes.fill(names.indexOf(type));
   for(let i=0;i<f.stain.length;i++)for(let c=0;c<3;c++)f.tint[i*3+c]=MATERIALS[type].color[c];
   f.sole.forEach((z,i)=>{z.stain=.1+i*.08;z.stainType=type;});f.revision++;
  }
  check(g,shoe+' '+type+' new stain');
  for(const wet of [.65,.12,0]){for(const f of g.feet){f.wetness.fill(wet);f.revision++;}check(g,shoe+' '+type+' drying '+wet);}
  for(const f of g.feet){f.sole[2].stain+=.1;f.revision++;}check(g,shoe+' '+type+' one changed zone');
  for(const f of g.feet){f.sole.forEach(z=>z.stain=0);f.revision++;}check(g,shoe+' '+type+' cleared soles');
 }
}
document.querySelector('#report').textContent=JSON.stringify({passed:results.every(r=>!r.changed),cases:results.length,results},null,2);
</script>
