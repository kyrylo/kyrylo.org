server {
  listen 80;

  # Configure URL rewrites
  # rewrite ^/old-pricing$ /pricing last;

  # Only needed if there's no CDN in front
  gzip on;

  # Turn on SSI with etags and long values
  ssi on;
  ssi_last_modified on;
  ssi_value_length 1024;

  # All web accessible files live here
  root /site/_site;

  # Shared project links often omit the slash. Keep their canonical base URL.
  location = /elsewhere {
    return 301 https://kyrylo.org/elsewhere/$is_args$args;
  }

  location = /puddle-walker {
    return 301 https://kyrylo.org/puddle-walker/$is_args$args;
  }

  location = /a-little-life {
    return 301 https://kyrylo.org/a-little-life/$is_args$args;
  }

  # Map error pages
  error_page 404 /404.html;

  # Folders starting with _ are not publicly accessible
  location ~ ^/_$ {
    internal;
  }

  # Make /up look first for /up.html then /up/index.html
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
}
